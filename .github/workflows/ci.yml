---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core ansible-lint yamllint
      - run: yamllint .
      - run: ansible-lint

  sanity:
    runs-on: ubuntu-latest
    steps:
      # ansible-test only runs from a path ending in
      # ansible_collections/<namespace>/<name>.
      - uses: actions/checkout@v7
        with:
          path: ansible_collections/pypb/arch_workstation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core
      # Not --docker, because its container setup fails on the GitHub runner when
      # remounting /sys/fs/cgroup.
      - run: ansible-test sanity --venv --python 3.14 --requirements
        working-directory: ansible_collections/pypb/arch_workstation

  # Add a molecule job here, with a matrix of scenarios under extensions/molecule/,
  # once the first role is added. See pypb.homelab for the layout.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ansible-core
      - run: ansible-galaxy collection build
